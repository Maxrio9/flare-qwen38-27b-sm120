name: Native serving

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm protobuf-compiler libssl-dev liburing-dev
      - name: Build native serving
        id: build
        run: cargo build --locked --release --manifest-path flare/Cargo.toml
      - name: Test native runtime on Linux
        if: runner.os == 'Linux'
        run: |
          ulimit -l
          sudo prlimit --pid $$ --memlock=67108864:67108864
          cargo test --locked --release --manifest-path helios/Cargo.toml --target-dir flare/target --features runtime-package,server
      - name: Test native CLI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --locked --release --manifest-path flare/Cargo.toml
